# Configuration d'Alembic. Aucune URL ni aucun secret ici : `migrations/env.py` les lit dans
# `MigrationSettings`, depuis l'environnement ou le fichier non versionné `.env.migration`.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Le préfixe `v` rend le nom du fichier valide pour un module Python.
file_template = v%%(rev)s_%%(slug)s
