# Règles d'accès de PostgreSQL en production, lues de haut en bas ; la première qui correspond
# s'applique. Tout ce qui n'est pas explicitement admis est refusé.

# Administration locale uniquement par le socket, et seulement par l'utilisateur système
# `postgres` (initialisation, `docker exec -u postgres`).
local   all          postgres                                   peer

# Les trois rôles de l'application, en TLS et avec SCRAM, depuis le seul sous-réseau du serveur :
# le réseau interne `data` (`samenet`), quel que soit son adressage.
hostssl taskhandler  taskhandler_app,taskhandler_migrator,taskhandler_backup  samenet  scram-sha-256

# Tout le reste : refusé, chiffré ou non.
host    all          all                                        all             reject
local   all          all                                                        reject
