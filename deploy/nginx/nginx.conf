# Proxy inverse de production : seul point d'entrée exposé. Il termine TLS, borne la taille et le
# rythme des requêtes, puis transmet à l'API sur le réseau interne `edge`.

# Image non root : pas de port < 1024, PID et fichiers temporaires sur le tmpfs `/tmp`.
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Aucune version annoncée dans les en-têtes ni dans les pages d'erreur.
    server_tokens off;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Journal JSON : chemin sans chaîne de requête (elle peut contenir des données personnelles),
    # jamais d'en-tête `Authorization` ni de corps. L'identifiant relie la ligne au journal de l'API.
    log_format api escape=json
        '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
        '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration":$request_time,"request_id":"$upstream_http_x_request_id"}';
    access_log /dev/stdout api;

    # --- Taille et délais (OWASP API4) -----------------------------------------------------------
    # Même limite que l'API (1 Mio) : un corps trop gros est refusé avant de l'atteindre.
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    # Contre les connexions lentes (Slowloris) : un client trop lent est coupé.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    # --- Débit par adresse IP --------------------------------------------------------------------
    # Premier rempart, grossier, avant les limites fines de l'API (par compte, par route) : il
    # absorbe les rafales sans solliciter Redis ni PostgreSQL.
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # --- TLS (profil « intermédiaire » de Mozilla) -------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    # Les tickets de session affaibliraient la confidentialité persistante.
    ssl_session_tickets off;

    upstream api {
        server api:8000;
        keepalive 16;
    }

    # Sonde de santé du conteneur : boucle locale seulement, port jamais publié.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /health {
            return 204;
        }
        location / {
            return 404;
        }
    }

    # Nom de serveur inconnu (SNI absent ou différent) : la poignée de main TLS est refusée, sans
    # même présenter de certificat.
    server {
        listen 8443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name api.taskhandler.localhost;

        ssl_certificate /run/tls/nginx.crt;
        ssl_certificate_key /run/tls/nginx.key;

        limit_req zone=per_ip burst=40 nodelay;
        limit_conn conn_per_ip 20;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Remplacé, jamais complété : un `X-Forwarded-For` envoyé par le client est écrasé par
            # l'adresse réelle, seule valeur que l'API accepte de ce proxy de confiance.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Erreurs produites par nginx : même format RFC 9457 que l'API, avec ses en-têtes.
        error_page 413 = @too_large;
        error_page 429 = @too_many_requests;
        error_page 502 503 504 = @unavailable;

        location @too_large {
            include /etc/nginx/security-headers.conf;
            default_type application/problem+json;
            return 413 '{"type":"about:blank","title":"Content Too Large","status":413,"detail":"La requête est trop volumineuse."}';
        }

        location @too_many_requests {
            include /etc/nginx/security-headers.conf;
            add_header Retry-After "1" always;
            default_type application/problem+json;
            return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Trop de requêtes. Réessayez plus tard."}';
        }

        location @unavailable {
            include /etc/nginx/security-headers.conf;
            add_header Retry-After "5" always;
            default_type application/problem+json;
            return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"Service momentanément indisponible."}';
        }
    }
}
